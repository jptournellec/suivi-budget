<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Budgétaire Collaboratif</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: var(--text-main);
            font-weight: 600;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 14px 16px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .project-name {
            font-weight: 500;
            color: var(--text-main);
        }

        .amount {
            font-family: monospace;
            font-size: 1rem;
        }
        
        th.text-right, td.text-right {
            text-align: right;
        }

        .add-project-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed var(--border-color);
        }

        input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Suivi Budgétaire (Connecté à Supabase)</h1>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nom du Projet</th>
                    <th class="text-right">Budget Initial</th>
                    <th class="text-right">Révision (Rev1)</th>
                    <th class="text-right">Révision (Rev2)</th>
                </tr>
            </thead>
            <tbody id="project-rows">
                </tbody>
        </table>
    </div>

    <div class="add-project-form">
        <input type="text" id="p-name" placeholder="Nom du projet..." required>
        <input type="number" id="p-budget" placeholder="Budget Initial (€)..." required>
        <input type="number" id="p-rev1" placeholder="Rev1 (€)...">
        <input type="number" id="p-rev2" placeholder="Rev2 (€)...">
        <button onclick="addProject()">Ajouter</button>
    </div>
</div>

<script>
    // ⚠️ METS TES PROPRES CLÉS ICI :
    const SUPABASE_URL = "https://awojmkrbcxhjjyabfwkx.supabase.co/rest/v1/"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3b2pta3JiY3hoamp5YWJmd2t4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTc2NzksImV4cCI6MjA5NjE3MzY3OX0.Qr3M8PImiJBpocGvzUp94MSUU-B5YKnmNubDHZ4nGgc";

    // Initialisation du client Supabase
    const supabase = lib.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fonction pour formater l'argent
    function formatCurrency(amount) {
        if (amount === null || amount === undefined || amount === "") return "-";
        return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(amount);
    }

    // 1. LIRE LES DONNÉES (Afficher au chargement de la page)
    async function loadProjects() {
        const { data, error } = await supabase
            .from('projets')
            .select('*')
            .order('created_at', { ascending: true });

        if (error) {
            console.error("Erreur lors du chargement :", error);
            return;
        }

        const tbody = document.getElementById('project-rows');
        tbody.innerHTML = ""; // On vide le tableau avant de le remplir

        data.forEach(project => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="project-name">${project.nom}</td>
                <td class="amount text-right">${formatCurrency(project.budget_initial)}</td>
                <td class="amount text-right">${formatCurrency(project.rev1)}</td>
                <td class="amount text-right">${formatCurrency(project.rev2)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 2. ENREGISTRER LES DONNÉES (Ajouter un projet)
    async function addProject() {
        const nom = document.getElementById('p-name').value;
        const budget_initial = document.getElementById('p-budget').value;
        const rev1 = document.getElementById('p-rev1').value || null;
        const rev2 = document.getElementById('p-rev2').value || null;

        if (!nom || !budget_initial) {
            alert("Veuillez remplir au moins le nom et le budget initial.");
            return;
        }

        // Envoi à Supabase
        const { error } = await supabase
            .from('projets')
            .insert([{ nom, budget_initial, rev1, rev2 }]);

        if (error) {
            alert("Erreur lors de la sauvegarde : " + error.message);
        } else {
            // Réinitialiser le formulaire et recharger la liste
            document.getElementById('p-name').value = '';
            document.getElementById('p-budget').value = '';
            document.getElementById('p-rev1').value = '';
            document.getElementById('p-rev2').value = '';
            loadProjects();
        }
    }

    // Lancer le chargement automatique dès que la page s'ouvre
    window.onload = loadProjects;
</script>

</body>
</html>
